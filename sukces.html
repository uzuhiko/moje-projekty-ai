<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Oddawaj.pl - Twój Dokument</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-3xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-xl font-bold">Twój Dokument Prawny</h1>
            <span id="statusBadge" class="text-xs font-semibold text-amber-400 bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/20">Generowanie dokumentu...</span>
        </div>
        
        <div id="legalDoc" class="bg-slate-950 p-6 rounded-xl border border-slate-800 text-slate-300 whitespace-pre-wrap font-mono text-sm min-h-[350px] max-h-[500px] overflow-y-auto">
            Trwa pisanie spersonalizowanego pisma procesowego/reklamacyjnego na podstawie Twojego zgłoszenia...
        </div>

        <button onclick="navigator.clipboard.writeText(document.getElementById('legalDoc').innerText); alert('Pismo zostało skopiowane do schowka!');" class="mt-6 w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition-all shadow-lg shadow-emerald-900/20">
            Kopiuj pismo do schowka
        </button>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const docElement = document.getElementById('legalDoc');
            const badge = document.getElementById('statusBadge');
            
            // Pobieramy problem wpisany przez użytkownika na stronie głównej
            const userProblem = localStorage.getItem('oddawaj_user_problem') || 'Problem z reklamacją / opóźnieniem usługi lub towaru';

            try {
                // Wysyłamy żądanie do OpenAI przez nasz backend na Vercelu
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: userProblem })
                });
                
                const data = await response.json();
                console.log('Odpowiedź z AI:', data);

                // Obsługujemy różne warianty kluczy zwracanych przez backend
                const resultText = data.text || data.document || data.choices?.[0]?.message?.content;

                if (resultText) {
                    docElement.innerText = resultText;
                    badge.innerText = "Dokument Gotowy";
                    badge.className = "text-xs font-semibold text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/20";
                } else {
                    docElement.innerText = "Otrzymano odpowiedź z serwera, ale format jest nieznany:\n\n" + JSON.stringify(data, null, 2);
                }
            } catch (err) {
                console.error(err);
                docElement.innerText = "Wystąpił błąd podczas generowania pisma: " + err.message;
                badge.innerText = "Błąd";
                badge.className = "text-xs font-semibold text-red-400 bg-red-500/10 px-3 py-1 rounded-full border border-red-500/20";
            }
        });
    </script>
</body>
</html>
