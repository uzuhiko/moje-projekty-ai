<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oddawaj.pl - Twój Dokument</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between p-6 bg-slate-950">

    <div class="max-w-2xl mx-auto w-full text-center my-auto">
        <div class="w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-emerald-500/20">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        </div>
        
        <h1 class="text-3xl font-bold mb-2 text-white">Płatność Przyjęta!</h1>
        <p class="text-slate-400 mb-8">Prawnik AI przygotowuje Twoje spersonalizowane pismo...</p>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl text-left relative overflow-hidden">
            <div class="flex items-center justify-between mb-4 pb-4 border-b border-slate-800">
                <span id="status-badge" class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20">
                    <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                    Generowanie dokumentu...
                </span>
                <button id="copy-btn" onclick="copyToClipboard()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition hidden flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                    Kopiuj pismo
                </button>
            </div>

            <pre id="document-output" class="whitespace-pre-wrap text-sm font-mono text-slate-300 leading-relaxed min-h-[200px]">Trwa pisanie pisma procesowego/reklamacyjnego na podstawie Twojego zgłoszenia...</pre>
        </div>
    </div>

    <script>
        async function generateDocument() {
            const prompt = localStorage.getItem('legalPrompt') || 'Brak opisu sprawy.';
            const outputEl = document.getElementById('document-output');
            const badgeEl = document.getElementById('status-badge');
            const copyBtn = document.getElementById('copy-btn');

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });

                const data = await response.json();

                if (response.ok) {
                    // Obsługuje zarówno klucz 'document', jak i 'text'
                    const docText = data.document || data.text || 'Brak treści pisma.';
                    outputEl.textContent = docText;
                    
                    badgeEl.className = 'inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
                    badgeEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Gotowe';
                    copyBtn.classList.remove('hidden');
                } else {
                    throw new Error(data.error || 'Wystąpił błąd podczas generowania pisma.');
                }
            } catch (err) {
                outputEl.textContent = 'Wystąpił błąd: ' + err.message;
                badgeEl.className = 'inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20';
                badgeEl.innerHTML = 'Błąd';
            }
        }

        function copyToClipboard() {
            const text = document.getElementById('document-output').textContent;
            navigator.clipboard.writeText(text);
            alert('Pismo skopiowane do schowka!');
        }

        generateDocument();
    </script>
</body>
</html>
