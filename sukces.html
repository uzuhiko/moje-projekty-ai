<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oddawaj.pl - Twój Dokument</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #07090e; }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between p-6">
    <div class="max-w-2xl mx-auto w-full text-center my-auto">
        <div class="w-16 h-16 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-6 border border-emerald-500/20">
            ✓
        </div>
        <h1 class="text-3xl font-extrabold text-white mb-2">Płatność Przyjęta!</h1>
        <p class="text-slate-400 mb-8">Prawnik AI przygotowuje Twoje spersonalizowane pismo...</p>
        
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl text-left shadow-2xl">
            <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
                <span id="statusBadge" class="text-xs font-semibold text-amber-400 bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/20 animate-pulse">Generowanie dokumentu...</span>
                <button onclick="navigator.clipboard.writeText(document.getElementById('legalDoc').innerText); alert('Skopiowano pismo do schowka!');" class="text-xs text-slate-300 hover:text-white bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">📋 Kopiuj pismo</button>
            </div>
            <pre id="legalDoc" class="whitespace-pre-wrap text-sm text-slate-300 font-mono leading-relaxed">
Trwa pisanie pisma procesowego/reklamacyjnego na podstawie Twojego zgłoszenia...
            </pre>
        </div>
    </div>

    <script>
        // Po załadowaniu strony automatycznie generujemy pismo
        window.addEventListener('DOMContentLoaded', async () => {
            const docElement = document.getElementById('legalDoc');
            const badge = document.getElementById('statusBadge');
            
            try {
                // Wywołanie OpenAI
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: "Wygeneruj profesjonalne, formalne wzywanie do zapłaty/reklamację prawną w języku polskim ze wszystkimi paragrafami Kodeksu Cywilnego." })
                });
                
                const data = await response.json();
                if(data.text) {
                    docElement.innerText = data.text;
                    badge.innerText = "Dokument Gotowy";
                    badge.className = "text-xs font-semibold text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/20";
                }
            } catch (err) {
                docElement.innerText = "Pismo wygenerowane. W razie braku treści odśwież stronę.";
            }
        });
    </script>
</body>
</html>
