<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oddawaj.pl - Generator Pism Prawnych AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 md:p-8">

    <!-- NAGŁÓWEK -->
    <div class="text-center mb-8 max-w-xl">
        <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight mb-2 bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">
            Generator Pism Prawnych AI
        </h1>
        <p class="text-slate-400 text-sm md:text-base">
            Opisz swój problem w kilku słowach, a nasz algorytm przygotuje profesjonalny dokument gotowy do wysyłki.
        </p>
    </div>

    <!-- FORMULARZ -->
    <form id="legalForm" class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 shadow-2xl space-y-5">
        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Kategoria sprawy</label>
            <select id="category" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-indigo-500">
                <option>🛒 Reklamacja / Zwrot towaru</option>
                <option>🏠 Sprawa mieszkaniowa / Najem</option>
                <option>💼 Spór z pracodawcą</option>
                <option>⚠️ Przedsądowe wezwanie do zapłaty</option>
            </select>
        </div>

        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Przeciwnik (Firma / Osoba)</label>
            <input type="text" id="opponent" required placeholder="np. Media Expert Sp. z o.o." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-indigo-500">
        </div>

        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Opisz krótko sytuację</label>
            <textarea id="description" rows="3" required placeholder="np. Kupiłem telefon 12 maja, po tygodniu zepsuł się ekran, sklep odrzucił rękojmię..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-indigo-500 resize-none"></textarea>
        </div>

        <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Czego żądasz?</label>
            <input type="text" id="demand" required placeholder="np. Zwrotu 1500 zł na konto bankowe" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-indigo-500">
        </div>

        <button type="submit" class="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold rounded-xl shadow-lg shadow-indigo-500/25 transition-all transform active:scale-95">
            Generuj Pismo (9,99 zł) 🚀
        </button>
    </form>

    <script>
        document.getElementById('legalForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const category = document.getElementById('category').value;
            const opponent = document.getElementById('opponent').value;
            const description = document.getElementById('description').value;
            const demand = document.getElementById('demand').value;

            const fullPrompt = `Kategoria: ${category}. Przeciwnik: ${opponent}. Opis sprawy: ${description}. Żądanie: ${demand}.`;

            localStorage.setItem('legalPrompt', fullPrompt);

            // Przekierowanie do Twojej płatności Stripe
            window.location.href = "https://buy.stripe.com/5kQ5kw1Hl1fyeZadnL6c003";
        });
    </script>
</body>
</html>
